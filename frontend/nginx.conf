limit_req_zone $binary_remote_addr zone=lra_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=lra_ws:10m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 3m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://vk.com https://*.vk.com" always;

    location = /lra26 { return 308 /lra26/; }

    location /lra26/api/ {
        limit_req zone=lra_api burst=40 nodelay;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location /lra26/ws/ {
        limit_req zone=lra_api burst=10 nodelay;
        limit_conn lra_ws 5;
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 65s;
    }

    location /lra26/control/ {
        proxy_pass http://backend:8000/control/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /lra26/static/ { proxy_pass http://backend:8000; }
    location /lra26/media/ { alias /srv/media/; try_files $uri =404; }

    location /lra26/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /lra26/ {
        try_files $uri $uri/ /lra26/index.html;
        add_header Cache-Control "no-cache";
    }

    location / { return 404; }
}
