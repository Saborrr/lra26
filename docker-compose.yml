version: "3.8"

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: daphne -b 0.0.0.0 -p 8000 backend.asgi:application
    volumes:
      - ./backend:/app
      - sqlite_data:/app/data
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings.base
      - DATABASE_URL=sqlite:///data/db.sqlite3
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py runbot
    volumes:
      - ./backend:/app
    env_file:
      - backend/.env
    depends_on:
      - backend

volumes:
  sqlite_data: