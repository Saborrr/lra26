name: lra26

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lra26}
      POSTGRES_USER: ${POSTGRES_USER:-lra26}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lra26} -d ${POSTGRES_DB:-lra26}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [private]
    security_opt: [no-new-privileges:true]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings.production
      DATABASE_URL: postgresql://${POSTGRES_USER:-lra26}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lra26}
      REDIS_URL: redis://redis:6379/0
    command: ["sh", "-c", "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 backend.asgi:application"]
    volumes:
      - media_data:/app/media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [private, egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  bot:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings.production
      DATABASE_URL: postgresql://${POSTGRES_USER:-lra26}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lra26}
      REDIS_URL: redis://redis:6379/0
    command: ["python", "manage.py", "runbot"]
    depends_on:
      backend: { condition: service_healthy }
    networks: [private, egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LRA26_PORT:-8088}:80"
    volumes:
      - media_data:/srv/media:ro
    depends_on:
      backend: { condition: service_healthy }
    networks: [private]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]

networks:
  private:
    internal: true
  egress:

volumes:
  postgres_data:
  redis_data:
  media_data:
