name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements/development.txt
      - name: Lint
        working-directory: backend
        run: ruff check . && ruff format --check .
      - name: Verify migrations and settings
        working-directory: backend
        env:
          SECRET_KEY: ci-only-secret-not-used-in-production
        run: |
          python manage.py check --settings=backend.settings.development
          python manage.py makemigrations --check --dry-run --settings=backend.settings.development
      - name: Test
        working-directory: backend
        run: pytest --cov=apps --cov-fail-under=80
      - name: Audit Python dependencies
        working-directory: backend
        run: pip-audit -r requirements/production.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Typecheck and build PWA
        working-directory: frontend
        run: npm run check && npm run build
      - name: Audit runtime dependencies
        working-directory: frontend
        run: npm audit --omit=dev

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: lra26-backend:ci
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: lra26-frontend:ci
