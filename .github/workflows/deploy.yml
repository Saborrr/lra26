name: Deploy to Staging

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backend tests
        run: |
          cd backend
          pip install -r requirements/development.txt
          pytest

      - name: Frontend build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy
        run: echo "Deploy to staging server (e.g., via SSH, Heroku, Vercel)"