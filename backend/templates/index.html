<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЛРА - 2026 | Рейтинг команд</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html {
  scrollbar-width: thin;
  scrollbar-color: rgba(0, 255, 255, 0.3) transparent;
}
html::-webkit-scrollbar {
  width: 6px;
}
html::-webkit-scrollbar-track {
  background: transparent;
}
html::-webkit-scrollbar-thumb {
  background: rgba(0, 255, 255, 0.3);
  border-radius: 3px;
}
body {
  font-family: 'Exo 2', sans-serif;
  background: radial-gradient(ellipse at center, #0c0c1a 0%, #000415 40%, #000 100%);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding-bottom: 40px;
}
#stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
#earth {
  position: fixed;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 350px; height: 350px; border-radius: 50%;
  background: url('https://images-assets.nasa.gov/image/art002e009276/art002e009276-large.jpg') center/cover;
  box-shadow: inset 0 0 60px rgba(255,255,255,0.05), 0 0 80px rgba(100,200,255,0.2);
  animation: rotateSlow 60s linear infinite;
  z-index: 2;
  mask-image: radial-gradient(ellipse 55% 55% at center, white 0%, transparent 70%);
  opacity: 0.6;
}
@keyframes rotateSlow { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
.nebula-fade {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
  background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(20,40,80,0.8) 70%, rgba(0,0,20,1) 100%);
  pointer-events: none;
}
.header {
  position: relative;
  margin: 30px auto 20px;
  background: rgba(10,10,30,0.9); 
  backdrop-filter: blur(25px); 
  border: 1px solid rgba(100,200,255,0.3);
  padding: 25px 50px; 
  border-radius: 40px; 
  z-index: 10; 
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,100,200,0.3);
  max-width: 500px;
}
.logo { 
  font-size: 2.5em; 
  background: linear-gradient(135deg, #00ffff, #ff00ff, #ffff00); 
  -webkit-background-clip: text; 
  -webkit-text-fill-color: transparent; 
  font-weight: 800; 
  letter-spacing: 2px; 
}
.subtitle { 
  font-size: 1em; 
  color: rgba(255,255,255,0.9); 
  margin-top: 8px; 
  font-weight: 300; 
}
.leaderboard-container {
  position: relative;
  margin: 0 auto;
  max-width: 700px;
  width: 90%;
  z-index: 5;
}
.leaderboard {
  background: rgba(0,10,30,0.85); 
  backdrop-filter: blur(30px); 
  border: 1px solid rgba(0,255,255,0.4);
  border-radius: 25px; 
  padding: 30px; 
  box-shadow: 0 20px 80px rgba(0,0,0,0.9);
}
.leaderboard-title {
  text-align: center; 
  color: #00ffff; 
  margin-bottom: 25px; 
  font-size: 1.8em; 
  text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
table { 
  width: 100%; 
  border-collapse: collapse; 
  color: white; 
  font-size: 1em; 
}
th, td { 
  padding: 14px 12px; 
  text-align: left; 
  border-bottom: 1px solid rgba(0,255,255,0.15); 
}
th { 
  font-weight: 600; 
  color: #00ffff; 
  text-transform: uppercase; 
  letter-spacing: 1px; 
  font-size: 0.85em;
}
tr:last-child td {
  border-bottom: none;
}
.position { 
  font-size: 1.4em; 
  color: #ffd700; 
  text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); 
  font-weight: 700;
  width: 70px;
}
.team { 
  color: #00ff88; 
  font-weight: 500; 
}
.trainer {
  color: rgba(255,255,255,0.8);
}
.score { 
  color: #ffaa00; 
  font-size: 1.2em; 
  font-weight: 700; 
  text-shadow: 0 0 5px rgba(255, 170, 0, 0.5); 
}
.quests {
  color: rgba(200, 255, 255, 0.9);
}
.live-dot { 
  color: #00ff00; 
  animation: pulse 2s infinite; 
  font-size: 0.7em;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* Факты о космосе - теперь внизу под таблицей */
.facts-section {
  margin-top: 25px;
  text-align: center;
}
.fact {
  background: linear-gradient(135deg, rgba(0,50,100,0.6), rgba(50,0,100,0.4));
  backdrop-filter: blur(15px); 
  border: 1px solid rgba(100,200,255,0.2);
  padding: 20px 30px; 
  border-radius: 20px; 
  max-width: 600px;
  margin: 0 auto;
  font-size: 1em; 
  line-height: 1.5; 
  color: rgba(200,255,255,0.95);
  box-shadow: 0 5px 30px rgba(0,100,200,0.2);
}
.fact-label {
  font-size: 0.75em;
  color: rgba(0,255,255,0.7);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 8px;
}
.fact-icon {
  font-size: 1.3em;
  margin-right: 8px;
}

.admin-link {
  text-align: center; 
  margin-top: 20px; 
  color: rgba(255,255,255,0.5); 
  font-size: 0.85em;
}
.admin-link a {
  color: #00ff88; 
  text-decoration: none;
  transition: all 0.3s ease;
}
.admin-link a:hover {
  color: #00ffff;
  text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
}

.particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.particle {
  position: absolute; 
  background: radial-gradient(circle, rgba(255,255,255,0.8), transparent);
  border-radius: 50%; 
  pointer-events: none;
  animation: floatNatural 8s infinite linear;
}
@keyframes floatNatural {
  0% { transform: translateY(100vh) rotate(0deg) scale(0.2); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-20vh) rotate(360deg) scale(1); opacity: 0; }
}

/* Адаптивность */
@media (max-width: 600px) {
  .header {
    margin: 20px 15px;
    padding: 20px 25px;
  }
  .logo {
    font-size: 2em;
  }
  .leaderboard {
    padding: 20px 15px;
  }
  th, td {
    padding: 10px 8px;
    font-size: 0.9em;
  }
  .position {
    font-size: 1.2em;
  }
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="particles"></div>
<div class="nebula-fade"></div>
<div id="earth"></div>

<header class="header">
  <div class="logo">ЛРА - 2026</div>
  <div class="subtitle">Слет лидеров рабочего актива | 27-29.05.2026</div>
</header>

<div class="leaderboard-container">
  <div class="leaderboard">
    <h1 class="leaderboard-title">
      Рейтинг команд <span class="live-dot">●</span>
    </h1>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Команда</th>
          <th>Тренер</th>
          <th>Счёт</th>
          <th>Черные метки</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- Live data here -->
      </tbody>
    </table>
    
    <div class="admin-link">
      <a href="/trainer/">🛸 Тренерская</a> · <a href="/admin/">⚙️ Админка</a>
    </div>
  </div>
  
  <!-- Факты о космосе теперь под таблицей -->
  <div class="facts-section">
    <div class="fact" id="fact">
      <div class="fact-label">🚀 Факт о космосе</div>
      <div id="fact-text"></div>
    </div>
  </div>
</div>

<script>
// Stars - fewer and slower for natural look
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const stars = [];
for (let i = 0; i < 250; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.2 + 0.5,
    vx: (Math.random() - 0.5) * 0.2,
    opacity: Math.random() * 0.8 + 0.2,
    twinkle: Math.random() * 0.02 + 0.005
  });
}
let time = 0;
function animateStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stars.forEach(s => {
    s.x += s.vx;
    s.y += 0.05;
    s.opacity += (Math.sin(time * s.twinkle) - s.opacity) * 0.05;
    if (s.y > canvas.height) s.y = 0;
    if (s.x < 0 || s.x > canvas.width) s.vx *= -1;
    ctx.save();
    ctx.globalAlpha = s.opacity;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.restore();
  });
  time += 0.05;
  requestAnimationFrame(animateStars);
}
animateStars();

// Particles less frequent
function createParticle() {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + '%';
  p.style.width = p.style.height = (Math.random() * 3 + 1) + 'px';
  p.style.animationDuration = (Math.random() * 5 + 5) + 's';
  p.style.animationDelay = Math.random() * 3 + 's';
  document.getElementById('particles').appendChild(p);
  setTimeout(() => p.remove(), 8000);
}
setInterval(createParticle, 400);

// Space facts
const facts = [
  "Вселенная расширяется быстрее света — куда мы летим?",
  "Тёмная энергия составляет 68% космоса — неизвестная сила.",
  "Чёрные дыры: информация теряется навсегда?",
  "Мультивселенная: бесконечные 'ты' существуют параллельно.",
  "Квантовая неопределённость: позиция или скорость?",
  "Большой Взрыв: что было 'до'?",
  "Время — иллюзия? Энтропия решает направление.",
  "Земля — редкость в космосе (1 на миллиард?).",
  "Сознание произошло от Большого Взрыва? Теория всего.",
  "Конец Вселенной: тепловая смерть или Big Rip?"
];

function updateFact() {
  const factText = document.getElementById('fact-text');
  factText.textContent = facts[Math.floor(Math.random() * facts.length)];
}
updateFact();
setInterval(updateFact, 10000); // Меняем факт каждые 10 секунд

// Загрузка данных из API
let teams = [];

async function fetchLeaderboard() {
  try {
    const res = await fetch('/api/leaderboard/');
    if (!res.ok) throw new Error('API error');
    const data = await res.json();
    teams = data.map((t, i) => ({
      pos: i + 1,
      name: t.name,
      trainer: t.trainer_name || '—',
      score: t.score,
      penalty: t.penalty,
      total: t.total_score
    }));
    updateTable();
  } catch (err) {
    console.error('Ошибка загрузки:', err);
    // Если API недоступен — показываем заглушку
    const tbody = document.getElementById('table-body');
    if (!tbody.children.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;opacity:0.6;padding:20px">Загрузка данных...</td></tr>';
    }
  }
}

function updateTable() {
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = teams.map(t => 
     `<tr>
        <td class="position">#${t.pos}</td>
        <td class="team">${t.name}</td>
        <td class="trainer">${t.trainer}</td>
        <td class="score">${t.total}</td>
        <td class="quests">${t.penalty}</td>
      </tr>`
  ).join('');
}

// Первая загрузка
fetchLeaderboard();

// Обновление каждые 5 секунд
setInterval(fetchLeaderboard, 5000);

// WebSocket для мгновенных обновлений (если доступен)
try {
  const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${wsProtocol}//${location.host}/ws/leaderboard/`;
  const ws = new WebSocket(wsUrl);
  ws.onmessage = () => fetchLeaderboard();
  ws.onerror = () => console.log('WS недоступен, используем polling');
} catch(e) {}
</script>
</body>
</html>
